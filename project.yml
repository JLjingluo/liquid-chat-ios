name: LiquidChat
options:
  bundleIdPrefix: com.liquidchat
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  ChatGPTUI:
    url: https://github.com/alfianlosari/ChatGPTUI.git
    from: "0.3.1"

targets:
  LiquidChat:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LiquidChat
    dependencies:
      - package: ChatGPTUI
        product: ChatGPTUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liquidchat.app
        PRODUCT_NAME: LiquidChat
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: LiquidChat/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LiquidChat/Info.plist
      properties:
        CFBundleDisplayName: LiquidChat
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 用于语音输入对话
