name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

env:
  PROJECT_NAME: LiquidChat
  SCHEME_NAME: LiquidChat
  XCODE_PATH: /Applications/Xcode_26.0.1.app

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s ${{ env.XCODE_PATH }}/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME_NAME }}

      - name: Build for iOS (unsigned)
        run: |
          set -eo pipefail
          xcodebuild clean build \
            -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME_NAME }} \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "${{ env.PROJECT_NAME }}.app" -maxdepth 1 | head -1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ${{ env.PROJECT_NAME }}-unsigned.ipa Payload
          ls -lh ${{ env.PROJECT_NAME }}-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-unsigned-ipa
          path: ${{ env.PROJECT_NAME }}-unsigned.ipa
          retention-days: 30

      - name: Upload project archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-source
          path: |
            ${{ env.PROJECT_NAME }}/
            project.yml
            .github/
          retention-days: 90

